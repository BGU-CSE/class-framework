[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "classkit"
version = "0.1.0"
description = "Tooling for the class-framework: scaffold, ingest and validate a flipped-classroom course."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Chen Avin", email = "avin@bgu.ac.il" }]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    # Built-in extractors for /ingest (D-035): pip-installable, no system packages.
    "python-pptx>=0.6.21",
    "python-docx>=1.0",
    "pypdf>=4.0",
    # pypdf's optional font parser: without it, text in CFF/Type1-font PDFs (most textbooks)
    # comes out with broken characters, and pypdf logs a warning per font (F-09, F-10).
    "fonttools>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
classkit = "classkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/classkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
