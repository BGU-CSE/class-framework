# Homework defaults, learned over time as the teacher runs /create-homework.
# The /create-homework interviewer proposes these when the teacher doesn't
# specify; the teacher accepts or overrides. On approval, changes propagate
# back here so the next homework starts closer to the teacher's real habits.
# Validated against schemas/homework-defaults.schema.json (HW-D16).
#
# All fields are advisory — the teacher can override any of them per-homework.

# Default time budget for a homework (minutes). Adjust for your course pace.
total_minutes: 90

# Default item counts per class for an ordinary homework (HW-D27).
# Whole numbers; the number of items is their sum. At least one must be above 0.
# Classes must exist in item-classes.yaml.
# A new class added via /new-hw-type starts at 0 here and stays out of the
# typical homework until the teacher deliberately includes it.
# Targeted versions (HW-D26) are planned per quiz report and are not stored here.
default_class_counts:
  DIY: 2
  Practicing: 2
  Coding: 1
  Research: 0

# Default tools allowed in a homework. Must be declared in course.yaml's tools map.
# Individual homeworks and item classes can narrow or widen this.
allowed_tools: [pen_and_paper]

# Default collaboration policy.
# forbidden       — students work alone
# discussion_only — students may discuss but each submits their own work
# allowed         — students may collaborate fully
collaboration: discussion_only

# Default open-book policy for the homework.
open_book: true

# Reuse policy — how the pipeline treats prior items when planning.
# never    — always create fresh items
# practice — reuse allowed for practice homework only
# always   — reuse allowed for any purpose (graded, diagnostic, practice)
reuse_policy: practice

# Budget check tolerance (minutes). homework_budget_fits warns when the sum of
# item minutes falls outside total_minutes by more than this.
budget_tolerance_minutes: 15
